name: R-CMD-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ASReml-R is proprietary and cannot be installed from CRAN on CI.
      # GSPip checks for it only when an ASReml-dependent function is called.
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Do not ask pak to resolve the proprietary asreml Suggests entry.
          dependencies: '"hard"'
          extra-packages: |
            any::BGLR
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )

